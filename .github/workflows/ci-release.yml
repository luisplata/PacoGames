name: CI + Release
# Solo manual (workflow_dispatch): se dispara desde la pestaña Actions →
# "Run workflow". NO automático por push — evitar abuso de releases/costos.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.2
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Gradle heap override
        run: echo "ORG_GRADLE_PROJECT_org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G" >> "$GITHUB_ENV"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Test release-info script
        run: bash scripts/test_release_info.sh
      - name: Extract version
        id: version
        run: RUN_NUMBER=${{ github.run_number }} bash scripts/release-info.sh >> "$GITHUB_OUTPUT"
      # Decodificar keystore de producción desde secrets (patrón ref 500preguntas).
      # KEYSTORE_BASE64 = base64 del upload-keystore.jks; KEY_PROPERTIES =
      # contenido de android/key.properties con storeFile=upload-keystore.jks.
      - name: Decode keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          echo "${{ secrets.KEY_PROPERTIES }}" > android/key.properties
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - run: flutter build web
      - name: Package artifacts
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "${{ steps.version.outputs.APK_NAME }}"
          cp build/app/outputs/bundle/release/app-release.aab "${{ steps.version.outputs.AAB_NAME }}"
          cd build/web && zip -r "$GITHUB_WORKSPACE/${{ steps.version.outputs.ZIP_NAME }}" .
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          target_commitish: ${{ github.sha }}
          name: PacoGames dev ${{ steps.version.outputs.VERSION_NAME }} (build ${{ github.run_number }})
          generate_release_notes: true
          files: |
            ${{ steps.version.outputs.APK_NAME }}
            ${{ steps.version.outputs.AAB_NAME }}
            ${{ steps.version.outputs.ZIP_NAME }}
          fail_on_unmatched_files: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
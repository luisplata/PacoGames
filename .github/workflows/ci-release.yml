name: CI + Release
# Solo manual (workflow_dispatch): se dispara desde la pestaña Actions →
# "Run workflow". NO automático por push — evitar abuso de releases/costos.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer bump for the next release
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
permissions:
  contents: write
concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard — main branch only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::This workflow must run from main (current: ${{ github.ref }})."
          exit 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.2
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Gradle heap override
        run: echo "ORG_GRADLE_PROJECT_org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G" >> "$GITHUB_ENV"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Test release-info script
        run: bash scripts/test_release_info.sh
      - name: Extract version
        id: version
        run: |
          set -euo pipefail
          LATEST_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-b[0-9]+)?$' | head -1 || true)
          if [ -z "$LATEST_TAG" ]; then
            CURRENT_VERSION=$(grep '^version: ' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          else
            CURRENT_VERSION="${LATEST_TAG#v}"
            CURRENT_VERSION="${CURRENT_VERSION%%-*}"
          fi
          echo "current=$CURRENT_VERSION (latest tag: ${LATEST_TAG:-none})"
          CURRENT_VERSION="$CURRENT_VERSION" BUMP="${{ github.event.inputs.bump }}" bash scripts/release-info.sh >> "$GITHUB_OUTPUT"
      - name: Check tag is free
        run: |
          if git show-ref --verify --quiet "refs/tags/${{ steps.version.outputs.TAG }}"; then
            echo "::error::Tag ${{ steps.version.outputs.TAG }} already exists. Choose a different bump."
            exit 1
          fi
      - name: Show version
        run: |
          echo "versionName=${{ steps.version.outputs.VERSION_NAME }}"
          echo "versionCode=${{ steps.version.outputs.VERSION_CODE }}"
      # Decodificar keystore de producción desde secrets (patrón ref 500preguntas).
      # KEYSTORE_BASE64 = base64 del upload-keystore.jks; KEY_PROPERTIES =
      # contenido de android/key.properties con storeFile=upload-keystore.jks.
      - name: Decode keystore
        run: |
          mkdir -p android/app
          # tr -cd 'A-Za-z0-9+/=': descarta TODO lo que no sea base64
          # (newlines, headers, espacios que se cuelan al pegar secrets).
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -cd 'A-Za-z0-9+/=' | base64 --decode > android/app/upload-keystore.jks
          # KEY_PROPERTIES_B64 (base64 del key.properties): evita que bash
          # expanda caracteres como $#/$z que rompen la password.
          echo "${{ secrets.KEY_PROPERTIES_B64 }}" | tr -cd 'A-Za-z0-9+/=' | base64 --decode > android/key.properties
          ls -la android/app/upload-keystore.jks android/key.properties
          test -s android/app/upload-keystore.jks && echo "keystore decodificado OK"
      - name: Build APK
        run: flutter build apk --release --build-name="${{ steps.version.outputs.VERSION_NAME }}" --build-number="${{ steps.version.outputs.VERSION_CODE }}"
      - name: Build AAB
        run: flutter build appbundle --release --build-name="${{ steps.version.outputs.VERSION_NAME }}" --build-number="${{ steps.version.outputs.VERSION_CODE }}"
      - run: flutter build web
      - name: Package artifacts
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "${{ steps.version.outputs.APK_NAME }}"
          cp build/app/outputs/bundle/release/app-release.aab "${{ steps.version.outputs.AAB_NAME }}"
          cd build/web && zip -r "$GITHUB_WORKSPACE/${{ steps.version.outputs.ZIP_NAME }}" .
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          target_commitish: ${{ github.sha }}
          name: PacoGames ${{ steps.version.outputs.VERSION_NAME }} (versionCode ${{ steps.version.outputs.VERSION_CODE }})
          generate_release_notes: true
          files: |
            ${{ steps.version.outputs.APK_NAME }}
            ${{ steps.version.outputs.AAB_NAME }}
            ${{ steps.version.outputs.ZIP_NAME }}
          fail_on_unmatched_files: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}